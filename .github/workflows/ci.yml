name: PAPYRUS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Linters (Code Quality & Unused Variables)
        run: bun run lint

      - name: Run E2E Verification & Schemas
        run: bun run test:e2e

      - name: Type Check & Production Build
        run: bun run build
