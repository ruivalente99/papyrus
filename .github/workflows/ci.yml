name: PAPYRUS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linters (Code Quality & Unused Variables)
        run: npm run lint

      - name: Run E2E Verification & Schemas
        run: npm run test:e2e

      - name: Type Check & Production Build
        run: npm run build
